spring.application.name=event-notification-service

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/event_notification_db
spring.datasource.username=postgres
spring.datasource.password=Divishka@2006
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# AWS Region
aws.region=ap-south-1

# Existing SNS topic
sns.topic.arn=arn:aws:sns:ap-south-1:598085663085:OrderEvents

# Existing SQS queues
sqs.email.queue-url=https://sqs.ap-south-1.amazonaws.com/598085663085/OrderEmailQueue
sqs.analytics.queue-url=https://sqs.ap-south-1.amazonaws.com/598085663085/OrderAnalyticsQueue
sqs.notification.queue-url=https://sqs.ap-south-1.amazonaws.com/598085663085/OrderNotificationQueue