spring.application.name=event-notification-service
server.port=8080

# PostgreSQL (password comes from the DB_PASSWORD environment variable)
spring.datasource.url=jdbc:postgresql://localhost:5432/event_notification_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS (credentials are NOT here - the AWS default credentials chain is used)
aws.region=${AWS_REGION:ap-south-1}

# Existing SNS topic (OrderEvents)
sns.topic.arn=${SNS_TOPIC_ARN}

# Existing SQS queues
sqs.email.queue-url=${EMAIL_QUEUE_URL}
sqs.analytics.queue-url=${ANALYTICS_QUEUE_URL}
sqs.notification.queue-url=${NOTIFICATION_QUEUE_URL}
